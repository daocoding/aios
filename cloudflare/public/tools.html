<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>aiOS · Operating Sheets</title>
<style>
:root{--ink:#111316;--soft:#4a4f57;--mute:#8a9099;--line:#e3e6ea;--bg:#f7f7f5;--card:#fff;--acc:#0f766e;--accbg:#e8f5f3;--warn:#b45309;--bad:#b91c1c}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}
header h1{font-size:16px;margin:0}header a{color:var(--soft);text-decoration:none}header .sp{flex:1}
.logo{display:grid;grid-template-columns:repeat(3,5px);gap:1px}.logo i{width:5px;height:5px;background:var(--ink)}.logo i.o{background:transparent}.logo i.g{background:var(--mute)}
.layout{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 50px)}
aside{border-right:1px solid var(--line);background:var(--card);padding:10px;overflow:auto}
aside button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;font:inherit;color:var(--soft)}
aside button.on{background:var(--accbg);color:var(--ink);font-weight:600}aside small{color:var(--mute);font-family:ui-monospace,monospace;margin-right:6px}
main{padding:16px 20px;overflow:auto}
.top{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}.top h2{margin:0 0 4px;font-size:20px}.top p{margin:0;color:var(--soft);max-width:760px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.btn{border:1px solid var(--line);background:var(--card);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit}.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px}.kpi b{display:block;font-size:18px}.kpi span{color:var(--mute);font-size:12px}
.wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card);max-height:calc(100vh - 260px)}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;vertical-align:top}
th{position:sticky;top:0;background:#fafafa;font-size:12px;font-weight:600;color:var(--soft);text-align:left;padding:7px 8px;z-index:1;max-width:240px}
th.f{color:var(--acc)}td input,td select{width:100%;border:0;padding:7px 8px;font:inherit;background:transparent;min-width:70px}td input:focus,td select:focus{outline:2px solid var(--acc);background:#fff}
td.f{background:#f6fbfa;padding:7px 8px;white-space:nowrap;font-variant-numeric:tabular-nums}td.n input{text-align:right;font-variant-numeric:tabular-nums}
td.x{width:28px;text-align:center}td.x button{border:0;background:none;color:var(--mute);cursor:pointer;padding:7px}
tfoot td{background:#fafafa;font-weight:600;padding:7px 8px}
.p0{color:var(--bad);font-weight:600}.p1{color:var(--warn);font-weight:600}.ok{color:var(--acc)}
.status{color:var(--mute);font-size:12px;margin-left:auto}
#login{max-width:340px;margin:12vh auto;background:var(--card);padding:24px;border:1px solid var(--line);border-radius:12px}#login input{width:100%;padding:10px;margin:10px 0;border:1px solid var(--line);border-radius:8px}
@media(max-width:800px){.layout{grid-template-columns:1fr}aside{display:flex;overflow:auto;gap:4px}aside button{white-space:nowrap;width:auto}}
</style></head><body>
<header><div class="logo" id="logo"></div><h1>aiOS <span style="color:var(--mute);font-weight:500">Operating Sheets</span></h1><span class="sp"></span><label style="color:var(--soft)">Offer type <select id="otype" onchange="setSetting('offer_type',this.value)"><option value="physical">Physical goods</option><option value="digital">Digital / app / course</option><option value="service">Service</option><option value="local">Local business</option></select></label><label style="color:var(--soft)">Currency <select id="curr" onchange="setSetting('currency',this.value)"><option>$</option><option>€</option><option>£</option><option>¥</option><option>₹</option><option>R$</option><option>A$</option><option>C$</option><option>CHF </option><option>kr </option></select></label><a href="/">Content Review</a><span id="who" style="color:var(--mute)"></span></header>
<div id="login" hidden><h3>Passcode</h3><input id="pw" type="password" placeholder="Passcode"><button class="btn pri" onclick="login()">Unlock</button><p id="lerr" style="color:var(--bad)"></p></div>
<div class="layout" id="app" hidden><aside id="nav"></aside><main id="main"></main></div>
<input type="file" id="file" accept=".csv,.xlsx" hidden>
<script src="sheets.js"></script>
<script>
const S=window.AIOS_SHEETS,$=s=>document.querySelector(s);
const L=[1,1,1,1,0,2,1,1,1,1,0,1,1,1,1];$('#logo').innerHTML=L.map(v=>`<i class="${v==0?'o':v==2?'g':''}"></i>`).join('');
let TOOLS=[],cur=null,rows=[],dirty=false,saveT=null,base=null,SET={currency:'$',offer_type:'physical'};
const START=[['Day 1','owner-self-check','Score your decision habits'],['Day 1','unit-economics','Know your margin and break-even ROAS'],['Days 1-3','offer-scorecard','Score the offer; check cash exposure'],['Days 1-3','launch-plan','Write the kickoff plan'],['Week 1','selling-points','List and grade every selling point'],['Week 1','creator-pipeline','Start creator outreach'],['Weeks 2-4','asset-log','Log every asset; triage P0/P1/P2'],['Weeks 2-4','ad-diagnosis','Amplify proven assets'],['When scaling','scale-ceiling','Keep scaling or stop? Ceiling test'],['Weekly','hypothesis-ledger','Keep / kill / scale'],['Weekly','weekly-review','Retrospective']];
const lab=c=>{let l=(c.alt&&c.alt[SET.offer_type])||c.label;return l.replace(/\(\$\)/g,'('+SET.currency.trim()+')').replace(/ \$\)/g,' '+SET.currency.trim()+')')};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(m,p,b){const r=await fetch(p,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});if(r.status==401){show(false);throw 0}const j=await r.json();if(r.status==409){j.conflict=true}return j}
async function setSetting(k,v){SET=await api('PUT','/api/settings',{[k]:v});S.currency=SET.currency;if(cur)render(base)}
function show(ok){$('#login').hidden=ok;$('#app').hidden=!ok}
async function login(){const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:$('#pw').value})});if(r.ok){$('#pw').value='';init()}else $('#lerr').textContent='Wrong passcode'}
$('#pw').addEventListener('keydown',e=>e.key=='Enter'&&login());
async function init(){
  TOOLS=(await (await fetch('tools.json')).json()).tools;
  let me;try{me=await api('GET','/api/me')}catch{return}show(true);$('#who').textContent='· '+me.user;
  SET=await api('GET','/api/settings');S.currency=SET.currency;$('#otype').value=SET.offer_type;$('#curr').value=SET.currency;
  $('#nav').innerHTML=`<details open style="margin-bottom:8px"><summary style="cursor:pointer;font-weight:600;padding:6px 10px">Start here: 30-day path</summary>${START.map(([d,id,w])=>`<button onclick="openTool('${id}')"><small>${d}</small>${esc(w)}</button>`).join('')}</details><div style="font-weight:600;padding:6px 10px">All sheets</div>`+TOOLS.map(t=>`<button data-id="${t.id}" onclick="openTool('${t.id}')"><small>${t.module}</small>${esc(t.title)}</button>`).join('');
  openTool(location.hash.slice(1)||TOOLS[0].id);
}
async function openTool(id){
  if(dirty)await save();cur=TOOLS.find(t=>t.id==id)||TOOLS[0];location.hash=cur.id;
  document.querySelectorAll('aside button[data-id]').forEach(b=>b.classList.toggle('on',b.dataset.id==cur.id));
  const d=await api('GET','/api/sheets/'+cur.id+'?raw=1');rows=d.rows||[];base=d.updated_at;render(d.updated_at);
}
function typeOf(c){return c.type=='formula'?(c.fmt||'text'):c.type}
function cls(v){v=String(v);return /^P0|Drop|Need|Over|Missing|ERR/.test(v)?'p0':/^P1|Thin|Check/.test(v)?'p1':/^P2|Profit|OK|Yes|Scale/.test(v)?'ok':''}
function render(upd){
  const t=cur;
  $('#main').innerHTML=`<div class="top"><div><h2>${esc(t.title)}</h2><p>${esc(t.purpose)}</p></div></div>
  <div class="bar"><button class="btn pri" onclick="addRow()">+ Row</button>
  <button class="btn" onclick="importFile()">Import CSV/XLSX</button><button class="btn" onclick="exp('csv')">Export CSV</button><button class="btn" onclick="exp('xlsx')">Export XLSX</button>
  ${t.sample?'<button class="btn" onclick="loadSample()">Insert example rows</button>':''}<button class="btn" onclick="clearAll()">Clear</button>
  <span class="status" id="st">${upd?'Saved '+new Date(upd).toLocaleString():'Not saved yet'}</span></div>
  <div class="kpis" id="kpis"></div>
  <div class="wrap"><table><thead><tr>${t.columns.map(c=>`<th class="${c.type=='formula'?'f':''}" style="min-width:${c.w||110}px" title="${c.type=='formula'?esc('= '+c.f):''}">${esc(lab(c))}${c.type=='formula'?' ƒ':''}</th>`).join('')}<th></th></tr></thead>
  <tbody id="tb"></tbody><tfoot id="tf"></tfoot></table></div>`;
  body();
}
function cellHtml(c,r,i){
  const v=r[c.key]??'',ty=typeOf(c);
  if(c.type=='formula')return `<td class="f ${cls(v)}" data-k="${c.key}">${esc(S.fmt(v,ty))}</td>`;
  if(c.type=='select')return `<td><select data-i="${i}" data-k="${c.key}">${c.options.map(o=>`<option${o==v?' selected':''}>${esc(o)}</option>`).join('')}</select></td>`;
  const shown=S.numeric(ty)&&v!==''?(ty=='pct'?+(v*100).toFixed(4)+'%':v):v;
  return `<td class="${S.numeric(ty)?'n':''}"><input data-i="${i}" data-k="${c.key}" ${c.type=='date'?'type="date"':''} value="${esc(shown)}"></td>`;
}
function body(){
  const t=cur,cr=rows.map(r=>S.computeRow(t,r));
  $('#tb').innerHTML=cr.map((r,i)=>`<tr data-i="${i}">${t.columns.map(c=>cellHtml(c,r,i)).join('')}<td class="x"><button title="Delete row" onclick="delRow(${i})">✕</button></td></tr>`).join('');
  foot(cr);
}
function foot(cr){
  const t=cur;
  if(t.totals)$('#tf').innerHTML='<tr>'+t.columns.map(c=>{const a=t.totals[c.key];if(!a)return'<td></td>';const v=a=='COUNT'?cr.filter(r=>r[c.key]!==''&&r[c.key]!=null).length:cr.reduce((s,r)=>s+(+r[c.key]||0),0);return `<td>${a=='COUNT'?v+' rows':S.fmt(v,typeOf(c))}</td>`}).join('')+'<td></td></tr>';else $('#tf').innerHTML='';
  $('#kpis').innerHTML=(t.kpis||[]).map(k=>`<div class="kpi"><b>${S.fmt(S.kpi(k.f,cr),k.fmt)}</b><span>${esc((k.alt&&k.alt[SET.offer_type])||k.label)}</span></div>`).join('');
}
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.k==null||el.dataset.i==null)return;const c=cur.columns.find(c=>c.key==el.dataset.k);if(!c||!rows[+el.dataset.i])return;
  rows[+el.dataset.i][c.key]=S.parseInput(el.value,c.type);refreshRow(+el.dataset.i);touch()});
document.addEventListener('input',e=>{const el=e.target;if(el.tagName!='INPUT'||el.dataset.k==null)return;const c=cur.columns.find(c=>c.key==el.dataset.k);if(!c||!rows[+el.dataset.i])return;rows[+el.dataset.i][c.key]=S.parseInput(el.value,c.type);refreshRow(+el.dataset.i,true);touch()});
function refreshRow(i){const r=S.computeRow(cur,rows[i]);const tr=$(`#tb tr[data-i="${i}"]`);
  cur.columns.filter(c=>c.type=='formula').forEach(c=>{const td=tr.querySelector(`td[data-k="${c.key}"]`);td.textContent=S.fmt(r[c.key],typeOf(c));td.className='f '+cls(r[c.key])});
  foot(rows.map(r=>S.computeRow(cur,r)))}
function touch(){dirty=true;$('#st').textContent='Saving…';clearTimeout(saveT);saveT=setTimeout(save,700)}
async function save(){if(!cur)return;const d=await api('PUT','/api/sheets/'+cur.id,{rows,base_updated_at:base});
  if(d.conflict){$('#st').textContent='Conflict: changed elsewhere';if(confirm('This sheet was changed elsewhere (another tab or an agent).\nOK = reload their version (your unsaved edits are lost)\nCancel = overwrite with your version')){dirty=false;const r=await api('GET','/api/sheets/'+cur.id+'?raw=1');rows=r.rows||[];base=r.updated_at;render(base)}else{base=d.updated_at;return save()}return}
  dirty=false;base=d.updated_at;$('#st').textContent='Saved '+new Date(d.updated_at).toLocaleString()}
function addRow(){rows.push({});body();touch();const tb=$('#tb');tb.lastElementChild?.querySelector('input,select')?.focus()}
function delRow(i){rows.splice(i,1);body();touch()}
function loadSample(){rows=rows.concat(JSON.parse(JSON.stringify(cur.sample)));body();touch()}
function clearAll(){if(confirm('Delete all rows in this sheet?')){rows=[];body();touch()}}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exp(kind){const cr=rows.map(r=>S.computeRow(cur,r));
  if(kind=='csv')dl(new Blob([S.toCSV(cur,cr)],{type:'text/csv'}),`aios-${cur.id}.csv`);else dl(S.toXLSX(cur,rows),`aios-${cur.id}.xlsx`)}
function importFile(){$('#file').value='';$('#file').click()}
$('#file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;
  try{const m=f.name.endsWith('.xlsx')?await S.readXLSX(await f.arrayBuffer(),cur):S.parseCSV(await f.text());
    const add=S.matrixToRows(cur,m,lab);if(!add.length)return alert('No rows found. The first row must contain column names.');
    const mode=confirm(`Import ${add.length} rows.\nOK = append, Cancel = replace existing rows`);rows=mode?rows.concat(add):add;body();touch()}
  catch(err){alert('Import failed: '+err)}});
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(cur&&id!=cur.id)openTool(id)});
init();
</script></body></html>
