# Cloudflare Pages project for the aiOS Content Review app.
# Deploy:  npx wrangler pages deploy public --project-name <your-project>
name = "aios-review"
pages_build_output_dir = "public"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "aios-review"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Secret (never commit it):  npx wrangler pages secret put OWNER_TOKEN --project-name <your-project>
